<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- The page background before the app's code loads (the canvas of constants/palette.ts), so a dark page does not flash white. -->
    <style id="sobro-canvas">
      :root {
        color-scheme: light dark;
      }
      body {
        background-color: #f7f9fc;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #151a21;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      Ative o JavaScript para usar o Sobrô?.
    </noscript>
    <!-- The root element for the Expo app. -->
    <div id="root"></div>
  </body>
</html>
